<div class="grid">{% for p in products %}<a class="card" href="{{url_for('product',slug=p.slug)}}"><div class="thumb">{% if p.image_url %}<img src="{{p.image_url}}">{% else %}<div class="placeholder">{{p.title[:2]|upper}}</div>{% endif %}</div><div class="card-body"><div class="cat">{{p.category}}</div><h3>{{p.title}}</h3><div class="seller">@{{p.seller.username}}</div><div class="card-foot"><b>{{'%.2f'|format(p.price)}} €</b><span>→</span></div></div></a>{% else %}<div class="empty">Noch keine Produkte.</div>{% endfor %}</div>
